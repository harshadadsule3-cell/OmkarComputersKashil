<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h2 class="text-center">
Omkar Computers Login
</h2>

</div>

<div class="card-body">

<form th:action="@{/login}"
      method="post">

<div class="mb-3">

<label>Email</label>

<input type="email"
       name="username"
       class="form-control">

</div>

<div class="mb-3">

<label>Password</label>

<input type="password"
       name="password"
       class="form-control">

</div>

<button class="btn btn-success">

Login

</button>

</form>

</div>

</div>

</div>

</body>
</html>
