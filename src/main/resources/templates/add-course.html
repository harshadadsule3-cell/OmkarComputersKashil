<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Course</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">
<h2>Add Course</h2>
</div>

<div class="card-body">

<form th:action="@{/saveCourse}"
      th:object="${course}"
      method="post">

    <div class="mb-3">
        <label>Course Name</label>
        <input type="text"
               th:field="*{courseName}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Duration</label>
        <input type="text"
               th:field="*{duration}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Fees</label>
        <input type="number"
               th:field="*{fees}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Trainer Name</label>
        <input type="text"
               th:field="*{trainerName}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Description</label>
        <textarea th:field="*{description}"
                  class="form-control"></textarea>
    </div>

    <button class="btn btn-success">
        Save Course
    </button>

</form>

</div>

</div>

</div>

</body>
</html>
