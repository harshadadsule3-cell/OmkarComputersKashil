<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Score Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h2 class="text-center">
                Student Score Management
            </h2>

        </div>

        <div class="card-body">

            <a href="/addScore"
               class="btn btn-success mb-3">
                Add Score
            </a>

            <table class="table table-bordered table-striped">

                <thead class="table-dark">

              <tr>
    <th>ID</th>
    <th>Student Name</th>
    <th>Subject</th>
    <th>Marks</th>
    <th>Grade</th>
    <th>Action</th>
</tr>

                </thead>

                <tbody>

                <tr th:each="score : ${scores}">

    <td th:text="${score.id}"></td>

    <td th:text="${score.student.firstName}"></td>

    <td th:text="${score.subjectName}"></td>

    <td th:text="${score.marks}"></td>

    <td th:text="${score.grade}"></td>

    <td>

        <a th:href="@{/editScore/{id}(id=${score.id})}"
           class="btn btn-warning btn-sm">

            Edit

        </a>

        <a th:href="@{/deleteScore/{id}(id=${score.id})}"
           class="btn btn-danger btn-sm">

            Delete

        </a>

    </td>

</tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
