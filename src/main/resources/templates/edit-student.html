<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h2>Edit Student</h2>

        </div>

        <div class="card-body">

            <form th:action="@{/updateStudent}"
                  th:object="${student}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">

                <div class="mb-3">
                    <label>First Name</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{firstName}">
                </div>

                <div class="mb-3">
                    <label>Last Name</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{lastName}">
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email"
                           class="form-control"
                           th:field="*{email}">
                </div>

                <div class="mb-3">
                    <label>Mobile</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{mobile}">
                </div>

                <div class="mb-3">
                    <label>Address</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{address}">
                </div>

                <button type="submit"
                        class="btn btn-success">

                    Update Student

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
