<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Course</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h2>Edit Course</h2>

</div>

<div class="card-body">

<form th:action="@{/updateCourse}"
      th:object="${course}"
      method="post">

    <input type="hidden"
           th:field="*{id}">

    <div class="mb-3">

        <label>Course Name</label>

        <input type="text"
               class="form-control"
               th:field="*{courseName}">

    </div>

    <div class="mb-3">

        <label>Duration</label>

        <input type="text"
               class="form-control"
               th:field="*{duration}">

    </div>

    <div class="mb-3">

        <label>Fees</label>

        <input type="number"
               class="form-control"
               th:field="*{fees}">

    </div>

    <div class="mb-3">

        <label>Trainer Name</label>

        <input type="text"
               class="form-control"
               th:field="*{trainerName}">
    </div>

    <div class="mb-3">

        <label>Description</label>

        <textarea class="form-control"
                  th:field="*{description}">
        </textarea>

    </div>

    <button class="btn btn-success">

        Update Course

    </button>

</form>

</div>

</div>

</div>

</body>
</html>
