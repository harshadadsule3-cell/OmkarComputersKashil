<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">

<title>Edit Score</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h2>Edit Score</h2>

</div>

<div class="card-body">

<form th:action="@{/updateScore}"
      th:object="${score}"
      method="post">

<input type="hidden"
       th:field="*{id}">

<div class="mb-3">

<label>Student</label>

<select name="studentId"
        class="form-control">

<option th:each="student:${students}"
        th:value="${student.id}"
        th:text="${student.firstName}">
</option>

</select>

</div>

<div class="mb-3">

<label>Subject</label>

<input type="text"
       class="form-control"
       th:field="*{subjectName}">

</div>

<div class="mb-3">

<label>Marks</label>

<input type="number"
       class="form-control"
       th:field="*{marks}">

</div>

<div class="mb-3">

<label>Grade</label>

<input type="text"
       class="form-control"
       th:field="*{grade}">

</div>

<button class="btn btn-success">

Update Score

</button>

</form>

</div>

</div>

</div>

</body>
</html>
