<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Score</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h2>Add Student Score</h2>
        </div>

        <div class="card-body">

            <form th:action="@{/saveScore}"
                  th:object="${score}"
                  method="post">

                <!-- Student Dropdown -->

                <div class="mb-3">

                    <label class="form-label">
                        Select Student
                    </label>

                    <select name="studentId"
                            class="form-control">

                        <option value="">
                            Select Student
                        </option>

                        <option th:each="student : ${students}"
                                th:value="${student.id}"
                                th:text="${student.firstName}">
                        </option>

                    </select>

                </div>

                <!-- Subject -->

                <div class="mb-3">

                    <label class="form-label">
                        Subject Name
                    </label>

                    <input type="text"
                           th:field="*{subjectName}"
                           class="form-control">

                </div>

                <!-- Marks -->

                <div class="mb-3">

                    <label class="form-label">
                        Marks
                    </label>

                    <input type="number"
                           th:field="*{marks}"
                           class="form-control">

                </div>

                <!-- Grade -->

                <div class="mb-3">

                    <label class="form-label">
                        Grade
                    </label>

                    <input type="text"
                           th:field="*{grade}"
                           class="form-control">

                </div>

                <button type="submit"
                        class="btn btn-success">

                    Save Score

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
