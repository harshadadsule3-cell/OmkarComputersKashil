<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">


<div class="container-fluid">



</div>

</nav>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h2 class="text-center">
                Omkar Computers Admin Dashboard
            </h2>

        </div>

        <div class="card-body">

            <div class="mb-3">
            <div class="row mb-4">

    <div class="col-md-3">

        <div class="card bg-primary text-white">

            <div class="card-body text-center">

                <h5>Total Students</h5>

                <h2 th:text="${studentCount}"></h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card bg-success text-white">

            <div class="card-body text-center">

                <h5>Total Courses</h5>

                <h2 th:text="${courseCount}"></h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card bg-warning text-dark">

            <div class="card-body text-center">

                <h5>Total Enrollments</h5>

                <h2 th:text="${enrollmentCount}"></h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card bg-danger text-white">

            <div class="card-body text-center">

                <h5>Total Scores</h5>

                <h2 th:text="${scoreCount}"></h2>

            </div>

        </div>

    </div>

</div>


<div class="mb-3">

    <a href="/register" class="btn btn-success">
        Add Student
    </a>

    <a href="/courses" class="btn btn-primary">
        Manage Courses
    </a>

    <a href="/scores" class="btn btn-warning">
        Manage Scores
    </a>

    <a href="/enrollments" class="btn btn-info">
        View Enrollments
    </a>

</div>

            </div>

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Action</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="student : ${students}">

                    <td th:text="${student.id}"></td>

                    <td th:text="${student.firstName}"></td>

                    <td th:text="${student.lastName}"></td>

                    <td th:text="${student.email}"></td>

                    <td th:text="${student.mobile}"></td>

                    <td>

                        <a th:href="@{/editStudent/{id}(id=${student.id})}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a th:href="@{/deleteStudent/{id}(id=${student.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure?')">
                            Delete
                        </a>


                    </td>

                </tr>

                </tbody>

            </table>
            <a href="/logout"
   class="btn btn-danger">
   Logout
</a>

        </div>

    </div>

</div>

</body>
</html>
